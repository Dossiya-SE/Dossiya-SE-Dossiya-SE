name: Generate governed visual animations

on:
  push:
    branches:
      - main
    paths:
      - '06_mathematical_visualization_art/animations/**'
      - '.github/workflows/generate-visual-animations.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ecosystem-animation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install deterministic animation dependency
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate structural reveal
        run: python 06_mathematical_visualization_art/animations/generate_ecosystem_flow_v1.py
      - name: Commit generated derivative
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/animations/mathematics-ecosystem-flow-v1.gif
          if git diff --cached --quiet; then
            echo "Animation already deterministic and current."
          else
            git commit -m "build(visual): materialize ecosystem structural-reveal GIF"
            git push origin HEAD:main
          fi
