<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Mathematics Research Ecosystem</title><desc id="desc">Adaptive light and dark architecture for the twelve mathematics modules: foundations, models, examples, reproductions, skills, visualization, computing, verification, mathematical physics, engineering applications, literature atlas and research lab.</desc><style>:root{--bg:#fff;--panel:#f8fafc;--fg:#0f172a;--muted:#475569;--border:#94a3b8;--source:#4338ca;--obs:#0369a1;--state:#1d4ed8;--viable:#047857;--unc:#b45309;--haz:#b91c1c;--iface:#7e22ce;--dec:#a16207;--hyp:#be185d}@media(prefers-color-scheme:dark){:root{--bg:#07111f;--panel:#0e1d31;--fg:#eaf1f8;--muted:#9eb0c3;--border:#355a7b;--source:#a5b4fc;--obs:#38bdf8;--state:#60a5fa;--viable:#34d399;--unc:#fbbf24;--haz:#fb7185;--iface:#c084fc;--dec:#facc15;--hyp:#f472b6}}.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--border)}.fg{fill:var(--fg)}.muted{fill:var(--muted)}text{font-family:Inter,Segoe UI,Arial,sans-serif}.math{font-family:Georgia,'Times New Roman',serif}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><rect class="bg" width="1600" height="900" rx="28"/><text x="70" y="70" class="fg" font-size="38" font-weight="800">MATHEMATICS RESEARCH ECOSYSTEM — 12 UNIQUE PURPOSES</text><text x="70" y="106" class="muted" font-size="16">learn → define → derive → model → implement → visualize → verify → reproduce → apply → research</text><circle cx="800" cy="470" r="150" fill="var(--panel)" stroke="var(--border)" stroke-width="2"/><text x="800" y="440" text-anchor="middle" class="fg" font-size="23" font-weight="800">MATHEMATICAL</text><text x="800" y="472" text-anchor="middle" class="fg" font-size="23" font-weight="800">TRUTH + UTILITY</text><text x="800" y="515" text-anchor="middle" class="muted" font-size="14">source → code → verification</text><text x="800" y="540" text-anchor="middle" class="muted" font-size="14">→ reproduction → application</text>
<g font-size="14" font-weight="700"><rect x="100" y="160" width="250" height="95" rx="16" fill="var(--source)"/><text x="225" y="197" text-anchor="middle" fill="var(--bg)">01 · FOUNDATIONS</text><text x="225" y="223" text-anchor="middle" fill="var(--bg)" font-size="10">definitions · theorems · assumptions</text><rect x="420" y="120" width="250" height="95" rx="16" fill="var(--state)"/><text x="545" y="157" text-anchor="middle" fill="var(--bg)">02 · MODELS</text><text x="545" y="183" text-anchor="middle" fill="var(--bg)" font-size="10">state · parameters · constraints</text><rect x="930" y="120" width="250" height="95" rx="16" fill="var(--obs)"/><text x="1055" y="157" text-anchor="middle" fill="var(--bg)">03 · EXAMPLES</text><text x="1055" y="183" text-anchor="middle" fill="var(--bg)" font-size="10">worked / executable objects</text><rect x="1250" y="160" width="250" height="95" rx="16" fill="var(--viable)"/><text x="1375" y="197" text-anchor="middle" fill="var(--bg)">04 · REPRODUCTIONS</text><text x="1375" y="223" text-anchor="middle" fill="var(--bg)" font-size="10">independent quantitative checks</text><rect x="80" y="370" width="250" height="95" rx="16" fill="var(--unc)"/><text x="205" y="407" text-anchor="middle" fill="var(--bg)">05 · SKILLS</text><text x="205" y="433" text-anchor="middle" fill="var(--bg)" font-size="10">recognize → derive → generalize</text><rect x="90" y="590" width="250" height="95" rx="16" fill="var(--iface)"/><text x="215" y="627" text-anchor="middle" fill="var(--bg)">06 · VISUALIZATION ART</text><text x="215" y="653" text-anchor="middle" fill="var(--bg)" font-size="10">semantic geometry · publication</text><rect x="420" y="720" width="250" height="95" rx="16" fill="var(--state)"/><text x="545" y="757" text-anchor="middle" fill="var(--bg)">07 · COMPUTING</text><text x="545" y="783" text-anchor="middle" fill="var(--bg)" font-size="10">symbolic · numerical · HPC · formal</text><rect x="675" y="760" width="250" height="95" rx="16" fill="var(--haz)"/><text x="800" y="797" text-anchor="middle" fill="var(--bg)">08 · VERIFICATION</text><text x="800" y="823" text-anchor="middle" fill="var(--bg)" font-size="10">invariants · convergence · proof</text><rect x="930" y="720" width="250" height="95" rx="16" fill="var(--dec)"/><text x="1055" y="757" text-anchor="middle" fill="var(--bg)">09 · MATHEMATICAL PHYSICS</text><text x="1055" y="783" text-anchor="middle" fill="var(--bg)" font-size="10">laws → mechanisms → dynamics</text><rect x="1260" y="590" width="250" height="95" rx="16" fill="var(--viable)"/><text x="1385" y="627" text-anchor="middle" fill="var(--bg)">10 · ENGINEERING APPS</text><text x="1385" y="653" text-anchor="middle" fill="var(--bg)" font-size="10">energy · infrastructure · risk</text><rect x="1270" y="370" width="250" height="95" rx="16" fill="var(--source)"/><text x="1395" y="407" text-anchor="middle" fill="var(--bg)">11 · LITERATURE ATLAS</text><text x="1395" y="433" text-anchor="middle" fill="var(--bg)" font-size="10">provenance · lineage · sources</text><rect x="675" y="80" width="250" height="95" rx="16" fill="var(--hyp)"/><text x="800" y="117" text-anchor="middle" fill="var(--bg)">12 · RESEARCH LAB</text><text x="800" y="143" text-anchor="middle" fill="var(--bg)" font-size="10">hypotheses · experiments · failures</text></g><g stroke="var(--muted)" stroke-width="2" fill="none" marker-end="url(#a)" opacity=".8"><path d="M350 208C500 245 610 310 685 380"/><path d="M670 168C700 250 735 305 765 320"/><path d="M930 168C900 250 865 305 835 320"/><path d="M1250 208C1100 245 990 310 915 380"/><path d="M330 417C520 420 595 435 645 450"/><path d="M340 637C520 590 600 540 662 505"/><path d="M670 767C715 670 745 605 765 620"/><path d="M800 760V625"/><path d="M930 767C885 670 855 605 835 620"/><path d="M1260 637C1080 590 1000 540 938 505"/><path d="M1270 417C1080 420 1005 435 955 450"/><path d="M800 175V315"/></g><text x="70" y="865" class="muted" font-size="13">Same source equation may enter multiple modules only when its role changes. Theme adaptation changes presentation only; provenance, formulas, evidence state and module purpose remain invariant.</text></svg>